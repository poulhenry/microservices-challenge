spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5434/payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_user}
    password: ${PAYMENT_DB_PASSWORD:payment_password}
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: ${PAYMENT_SERVICE_PORT:8082}